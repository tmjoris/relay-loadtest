[package]
name = "relay-loadtest"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
funnel-sketch = { git = "https://github.com/tmjoris/funnel", version = "0.1.0" }
rand = "0.9"
rand_distr = "0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
uuid = { version = "1.28.0", features = ["v4"] }
zstd = "0.14.3"
